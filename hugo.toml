baseURL = "https://bIackr0se.github.io/blog/"
locale = "en-us"
title = "b̷I̶a̸c̷k̶r̷0̴s̸e̷"
theme = "blackrose"

[params]
  author = "Jaafer Rahmani"
  # author + role drive the hero identity line and the plain og:title;
  # the visual brand and the <title> tag keep the glitched wordmark.
  role = "AI Security Researcher"
  github = "bIackr0se"
  email = "jaafer.rahmani@owasp.org"
  # LinkedIn profile URL; the link renders only when this is non-empty.
  linkedin = "https://www.linkedin.com/in/jaafer-rahmani/"
  # ORCID profile URL; the link renders only when this is non-empty.
  orcid = "https://orcid.org/0009-0008-0975-2301"
  # Keeps the site out of search engines while it is a work in progress.
  # Set to false on the day you announce it (e.g. on LinkedIn) to allow indexing.
  noindex = false
  description = "Jaafer Rahmani. AI red teaming // security engineering. Breaking models to make them harder to break."

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = false
    guessSyntax = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    name = "work"
    url = "/projects/"
    weight = 1
  [[menu.main]]
    name = "writing"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "about"
    url = "/about/"
    weight = 3

[outputs]
  home = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"
  category = "categories"
