    title: "CVE-2026-58196: SSRF in ToolHive"
    desc: Host-side SSRF in an MCP runtime's auth discovery, reaching cloud instance metadata from outside the container sandbox the tool exists to enforce. Full writeup, fixed in v0.31.0.
    url: projects/toolhive-ssrf/
  - kind: Framework
    title: KEYSER
    desc: Stateful adversarial campaign evaluation against ML-based intrusion detection in industrial automation. To appear at IEEE ETFA 2026.
    url: "#research"
