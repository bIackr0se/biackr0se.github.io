domains:
  - title: AI Red Teaming
    copy: Adversarial ML and LLM-agent offense. Evasion, model extraction, data poisoning, prompt injection against agent pipelines, and breaking AI-agent infrastructure, proven against the ML that defends live industrial networks.
    tags: [adversarial-ml, llm-agents, evasion, prompt-injection, cve]
  - title: Security Engineering
    copy: The build side of the same fight. ML-driven SIEM and IDS for critical infrastructure, OT/ICS protocol security across Modbus, CAN, and PROFINET, MITRE ATT&CK mapping, detection hardened against adaptive evasion, fixes disclosed upstream.
    tags: [siem, ids, ot-ics, att&ck, disclosure]

